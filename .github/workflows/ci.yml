name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS · build · test
    runs-on: macos-15

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

    steps:
      - uses: actions/checkout@v4

      # Fails fast on an unpinnable lock, before minutes are spent on a build.
      - name: Check dependency pins
        run: ./scripts/check-deps.sh

      # Also before the build: a formatting failure should not cost eight minutes.
      # Xcode's clang-format, so there is nothing to install.
      - name: Check formatting
        run: |
          find src tests tools \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 "$(xcrun -f clang-format)" --dry-run -Werror

      # Keyed on the lock, so a dependency bump busts the cache and nothing else does.
      - name: Restore dependency sources
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cpm-package-lock.cmake', 'cmake/DependencyPins.cmake') }}

      - name: Restore compile cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Install toolchain
        run: brew bundle

      # The ci preset is the release preset plus warnings-as-errors.
      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci --parallel 4

      # End-to-end without an audio device: load a project, render it, check the
      # result is a real non-silent WAV.
      - name: Offline render smoke test
        run: |
          ./build/ci/tools/dew_render_artefacts/RelWithDebInfo/dew_render \
            examples/demo.dew "${RUNNER_TEMP}/out.wav" --seconds 4

      # Text -> project -> audible WAV, with no display and no audio device.
      # This fails if the language regresses, if the bake regresses, OR if the
      # result is silent - dew_score exits non-zero on a score that compiles to
      # no notes, the same way dew_render does on a silent render.
      - name: Score compiles and renders end to end
        run: |
          SCORE=./build/ci/tools/dew_score_artefacts/RelWithDebInfo/dew_score
          "${SCORE}" examples/amber.score --check
          "${SCORE}" examples/amber.score "${RUNNER_TEMP}/amber.dew"
          ./build/ci/tools/dew_render_artefacts/RelWithDebInfo/dew_render \
            "${RUNNER_TEMP}/amber.dew" "${RUNNER_TEMP}/amber.wav" --seconds 4

      # A separate PROCESS, which is the part a unit test cannot do. Two
      # compiles inside one process read the same memory and agree even when
      # something is reading memory it should not; a fresh process does not.
      # That is how a mute budget sorting with an inconsistent comparator - and
      # so running off the end of its range - stayed invisible: the same score
      # compiled to different music about one run in four.
      #
      # The second half is the promise the stored score makes: compiling into a
      # project that already holds the result is an update, not a second copy.
      - name: A score compiles to the same thing every time
        run: |
          SCORE=./build/ci/tools/dew_score_artefacts/RelWithDebInfo/dew_score
          "${SCORE}" examples/amber.score "${RUNNER_TEMP}/again.dew"
          cmp "${RUNNER_TEMP}/amber.dew" "${RUNNER_TEMP}/again.dew"

          cp "${RUNNER_TEMP}/amber.dew" "${RUNNER_TEMP}/base.dew"
          "${SCORE}" examples/amber.score "${RUNNER_TEMP}/rebaked.dew" \
            --into "${RUNNER_TEMP}/base.dew"
          cmp "${RUNNER_TEMP}/amber.dew" "${RUNNER_TEMP}/rebaked.dew"

      # dew_shot is how the design system is reviewed, and until now the only
      # tool with nothing checking it runs at all. Offscreen, so no display.
      - name: The screenshot tool renders
        run: |
          ./build/ci/tools/dew_shot_artefacts/RelWithDebInfo/dew_shot \
            gallery "${RUNNER_TEMP}/gallery.png"
          test -s "${RUNNER_TEMP}/gallery.png"
          ./build/ci/tools/dew_shot_artefacts/RelWithDebInfo/dew_shot \
            editor "${RUNNER_TEMP}/roll.png" --project examples/melody.dew --tab piano-roll
          test -s "${RUNNER_TEMP}/roll.png"

      # Everything the website reads - the score language, the design tokens
      # and the highlighted samples - regenerated in a SECOND PROCESS and
      # compared byte for byte.
      #
      # dew_tests already holds the committed file against what the emitter
      # writes, in process. This is the other half, and it is the half that
      # caught the score compiler: two runs inside one process read the same
      # memory and agree even when something is reading memory it should not.
      # It costs a second and it needs no Node.
      - name: The generated reference is what the emitter writes
        run: |
          ./build/ci/tools/dew_docs schema "${RUNNER_TEMP}/score-schema.json"
          cmp "${RUNNER_TEMP}/score-schema.json" website/src/generated/score-schema.json
          ./build/ci/tools/dew_shot_artefacts/RelWithDebInfo/dew_shot \
            tokens "${RUNNER_TEMP}/design-tokens.json"
          cmp "${RUNNER_TEMP}/design-tokens.json" website/src/generated/design-tokens.json
          ./build/ci/tools/dew_shot_artefacts/RelWithDebInfo/dew_shot \
            samples "${RUNNER_TEMP}/score-samples.json" \
            examples/amber.score examples/drift.score examples/neon.score
          cmp "${RUNNER_TEMP}/score-samples.json" website/src/generated/score-samples.json

      # The manifest is generated at configure time; if it differs from what is
      # committed, the two have drifted.
      - name: Dependency manifest is up to date
        run: git diff --exit-code -- THIRD_PARTY.md

      - name: Upload build log artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/ci/CMakeFiles/*.log
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------
  # The score language against a second standard library.
  #
  # The README's determinism section says dew_lang writes out splitmix64 and
  # PCG32 by hand because libstdc++ and libc++ render different music. That has
  # been an untested claim for as long as CI has been macOS-only.
  #
  # It costs almost nothing to test: dew_lang links nothing, JUCE included, so
  # this job installs a compiler and CMake and no system libraries at all.
  # ----------------------------------------------------------------------------
  # ----------------------------------------------------------------------------
  # The website.
  #
  # ubuntu rather than macos-15, and a job of its own rather than steps on the
  # build. Nothing here needs a C++ toolchain: the two things the site reads
  # from dew - the score schema and the design tokens - are COMMITTED JSON, and
  # the screenshots are committed PNGs. That is the whole reason a C++ emitter
  # writes them. A website change should not wait behind a JUCE build, a JUCE
  # change should not wait behind npm, and ubuntu minutes are a fraction of
  # macOS ones.
  #
  # That the committed JSON still matches what the emitters write is the build
  # job's business, above, where the compiler already is.
  #
  # DEW_REQUIRE_NODE=1 so the skip that is right on a contributor's machine is
  # a failure here, where nobody would see it.
  # ----------------------------------------------------------------------------
  website:
    name: website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # node-version-file rather than a version here: website/.nvmrc is the one
      # home for which node this builds with, read by nvm locally and by this.
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Theme, formatting, lint, types, tests and build
        run: ./scripts/check-website.sh
        env:
          DEW_REQUIRE_NODE: 1

  lang-linux:
    name: linux · gcc · score language
    runs-on: ubuntu-latest

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

    steps:
      - uses: actions/checkout@v4

      - name: Restore dependency sources
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-linux-${{ hashFiles('cpm-package-lock.cmake', 'cmake/DependencyPins.cmake') }}

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build the language and its tests
        run: cmake --build build/linux --target dew_lang_tests

      - name: Test
        run: ./build/linux/tests/dew_lang_tests

  # ----------------------------------------------------------------------------
  # Sanitizers. Separate jobs because ASan and TSan cannot share a build, and
  # separate from the gate above because both are slow enough that putting them
  # in front of every push would be paid for by nobody running the gate.
  # ----------------------------------------------------------------------------
  sanitizers:
    name: macOS · ${{ matrix.preset }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tsan.supp

    steps:
      - uses: actions/checkout@v4

      - name: Restore dependency sources
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cpm-package-lock.cmake', 'cmake/DependencyPins.cmake') }}

      - name: Install toolchain
        run: brew bundle

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2
