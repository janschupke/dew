name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS · build · test
    runs-on: macos-15

    # ccache's own defaults are 5 GB and no depend mode, which is not what this
    # tree wants and not what a developer machine ends up configured with. In
    # the environment rather than a config file so there is nothing to install,
    # nothing untracked, and the same settings wherever the build runs.
    #   depend_mode   skips the preprocessor on a hit, which is where the
    #                 speed comes from once headers are stable.
    #   time_macros   juce_core_CompilationTime.cpp embeds __DATE__/__TIME__
    #                 and would otherwise miss on every single build.
    env:
      CCACHE_MAXSIZE: 10G
      CCACHE_DEPEND: "true"
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines

    steps:
      - uses: actions/checkout@v4

      # Fails fast on an unpinnable lock, before minutes are spent on a build.
      - name: Check dependency pins
        run: ./scripts/check-deps.sh

      # Also before the build: a formatting failure should not cost eight minutes.
      # Xcode's clang-format, so there is nothing to install.
      - name: Check formatting
        run: |
          find src tests tools \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 "$(xcrun -f clang-format)" --dry-run -Werror

      # Keyed on the lock, so a dependency bump busts the cache and nothing else does.
      - name: Restore dependency sources
        uses: actions/cache@v4
        with:
          # ~/.cache/CPM, because that is what CMakePresets.json's `base` puts
          # in the CMake cache - and a cacheVariable wins over the environment,
          # so a CPM_SOURCE_CACHE set here is read by nothing and this step
          # would faithfully cache an empty directory. The jobs that configure
          # WITHOUT a preset keep the variable, where it is what CPM reads.
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cpm-package-lock.cmake', 'cmake/DependencyPins.cmake') }}

      # Restore and save are split on purpose. actions/cache writes a new entry
      # on every run, and each of these is around a gigabyte against a 10 GB
      # per-repository budget that the CPM cache shares - so a busy day of pull
      # requests used to evict everything including itself. Only master writes;
      # a pull request reads master's entry and leaves it alone.
      - name: Restore compile cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-ci-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-ci-

      - name: Install toolchain
        run: brew bundle

      # The ci preset is the release preset plus warnings-as-errors.
      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci --parallel 4

      # End-to-end without an audio device: load a project, render it, check the
      # result is a real non-silent WAV.
      - name: Offline render smoke test
        run: |
          ./build/ci/tools/dew_render_artefacts/RelWithDebInfo/dew_render \
            examples/pulse-code.dew "${RUNNER_TEMP}/out.wav" --seconds 4

      # Text -> project -> audible WAV, with no display and no audio device.
      # This fails if the language regresses, if the bake regresses, OR if the
      # result is silent - dew_score exits non-zero on a score that compiles to
      # no notes, the same way dew_render does on a silent render.
      - name: Score compiles and renders end to end
        run: |
          SCORE=./build/ci/tools/dew_score_artefacts/RelWithDebInfo/dew_score
          "${SCORE}" examples/rhodes.score --check
          "${SCORE}" examples/rhodes.score "${RUNNER_TEMP}/rhodes.dew"
          ./build/ci/tools/dew_render_artefacts/RelWithDebInfo/dew_render \
            "${RUNNER_TEMP}/rhodes.dew" "${RUNNER_TEMP}/rhodes.wav" --seconds 4

      # A separate PROCESS, which is the part a unit test cannot do. Two
      # compiles inside one process read the same memory and agree even when
      # something is reading memory it should not; a fresh process does not.
      # That is how a mute budget sorting with an inconsistent comparator - and
      # so running off the end of its range - stayed invisible: the same score
      # compiled to different music about one run in four.
      #
      # The second half is the promise the stored score makes: compiling into a
      # project that already holds the result is an update, not a second copy.
      - name: A score compiles to the same thing every time
        run: |
          SCORE=./build/ci/tools/dew_score_artefacts/RelWithDebInfo/dew_score
          "${SCORE}" examples/rhodes.score "${RUNNER_TEMP}/again.dew"
          cmp "${RUNNER_TEMP}/rhodes.dew" "${RUNNER_TEMP}/again.dew"

          cp "${RUNNER_TEMP}/rhodes.dew" "${RUNNER_TEMP}/base.dew"
          "${SCORE}" examples/rhodes.score "${RUNNER_TEMP}/rebaked.dew" \
            --into "${RUNNER_TEMP}/base.dew"
          cmp "${RUNNER_TEMP}/rhodes.dew" "${RUNNER_TEMP}/rebaked.dew"

      # dew_shot is how the design system is reviewed, and until now the only
      # tool with nothing checking it runs at all. Offscreen, so no display.
      - name: The screenshot tool renders
        run: |
          ./build/ci/tools/dew_shot_artefacts/RelWithDebInfo/dew_shot \
            gallery "${RUNNER_TEMP}/gallery.png"
          test -s "${RUNNER_TEMP}/gallery.png"
          ./build/ci/tools/dew_shot_artefacts/RelWithDebInfo/dew_shot \
            editor "${RUNNER_TEMP}/roll.png" --project examples/late-rhodes.dew --tab piano-roll
          test -s "${RUNNER_TEMP}/roll.png"

      # Everything the website reads - the score language, the design tokens
      # and the highlighted samples - regenerated in a SECOND PROCESS and
      # compared byte for byte.
      #
      # dew_tests already holds the committed file against what the emitter
      # writes, in process. This is the other half, and it is the half that
      # caught the score compiler: two runs inside one process read the same
      # memory and agree even when something is reading memory it should not.
      # It costs a second and it needs no Node.
      - name: The generated reference is what the emitter writes
        run: |
          ./build/ci/tools/dew_docs schema "${RUNNER_TEMP}/score-schema.json"
          cmp "${RUNNER_TEMP}/score-schema.json" website/src/generated/score-schema.json
          ./build/ci/tools/dew_shot_artefacts/RelWithDebInfo/dew_shot \
            tokens "${RUNNER_TEMP}/design-tokens.json"
          cmp "${RUNNER_TEMP}/design-tokens.json" website/src/generated/design-tokens.json
          ./build/ci/tools/dew_shot_artefacts/RelWithDebInfo/dew_shot \
            samples "${RUNNER_TEMP}/score-samples.json" \
            examples/halcyon.score examples/rhodes.score \
            examples/ironmeter.score examples/nightfall.score
          cmp "${RUNNER_TEMP}/score-samples.json" website/src/generated/score-samples.json
          ./build/ci/tools/dew_mcp_artefacts/RelWithDebInfo/dew_mcp \
            schema "${RUNNER_TEMP}/mcp-tools.json"
          cmp "${RUNNER_TEMP}/mcp-tools.json" website/src/generated/mcp-tools.json

      # The manifest is generated at configure time; if it differs from what is
      # committed, the two have drifted.
      - name: Dependency manifest is up to date
        run: git diff --exit-code -- THIRD_PARTY.md

      - name: Upload build log artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/ci/CMakeFiles/*.log
          if-no-files-found: ignore

      # master only - see the restore step. always(), so a run that failed in
      # the tests still banks the compiling it did.
      - name: Save compile cache
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-ci-${{ github.sha }}

  # ----------------------------------------------------------------------------
  # The score language against a second standard library.
  #
  # The README's determinism section says dew_lang writes out splitmix64 and
  # PCG32 by hand because libstdc++ and libc++ render different music. That has
  # been an untested claim for as long as CI has been macOS-only.
  #
  # It costs almost nothing to test: dew_lang links nothing, JUCE included, so
  # this job installs a compiler and CMake and no system libraries at all.
  # ----------------------------------------------------------------------------
  # ----------------------------------------------------------------------------
  # The website.
  #
  # ubuntu rather than macos-15, and a job of its own rather than steps on the
  # build. Nothing here needs a C++ toolchain: the two things the site reads
  # from dew - the score schema and the design tokens - are COMMITTED JSON, and
  # the screenshots are committed PNGs. That is the whole reason a C++ emitter
  # writes them. A website change should not wait behind a JUCE build, a JUCE
  # change should not wait behind npm, and ubuntu minutes are a fraction of
  # macOS ones.
  #
  # That the committed JSON still matches what the emitters write is the build
  # job's business, above, where the compiler already is.
  #
  # DEW_REQUIRE_NODE=1 so the skip that is right on a contributor's machine is
  # a failure here, where nobody would see it.
  # ----------------------------------------------------------------------------
  website:
    name: website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # node-version-file rather than a version here: website/.nvmrc is the one
      # home for which node this builds with, read by nvm locally and by this.
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Theme, formatting, lint, types, tests and build
        run: ./scripts/check-website.sh
        env:
          DEW_REQUIRE_NODE: 1

  lang-linux:
    name: linux · gcc · score language
    runs-on: ubuntu-latest

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

    steps:
      - uses: actions/checkout@v4

      - name: Restore dependency sources
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-linux-${{ hashFiles('cpm-package-lock.cmake', 'cmake/DependencyPins.cmake') }}

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build the language and its tests
        run: cmake --build build/linux --target dew_lang_tests

      - name: Test
        run: ./build/linux/tests/dew_lang_tests

  # ----------------------------------------------------------------------------
  # The whole application on the other two platforms.
  #
  # dew was macOS-only for as long as nothing else compiled it, and the cost of
  # that was invisible: the MCP server minted its session ids with
  # arc4random_buf, which is in libc on Apple and which glibc only grew in 2.36,
  # so the Linux build did not compile at all and nobody could have known.
  #
  # These build the app AND the suite, because a build that links is not the
  # same claim as a suite that passes, and the interesting failures on a new
  # platform are the runtime ones.
  #
  # NOT warnings-as-errors, and that is deliberate rather than lazy: JUCE's own
  # sources are compiled into dew's targets and inherit dew's warning flags, and
  # gcc's -Wshadow fires inside juce_audio_formats where clang's does not.
  # Turning those into errors would make the gate a report on JUCE. The macOS
  # `ci` preset remains the gate for dew's own warnings.
  # ----------------------------------------------------------------------------
  windows:
    name: windows · msvc · build · test
    runs-on: windows-latest

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cpm-package-lock.cmake', 'cmake/DependencyPins.cmake') }}

      # The Visual Studio generator, for the reason dist-windows exists: Ninja
      # needs cl.exe on PATH and this needs nothing installed.
      - name: Configure
        run: >
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DDEW_BUILD_TESTS=ON
          -DDEW_WRITE_THIRD_PARTY=OFF

      # dew_lang_tests as well as dew_tests: ctest discovers every test the
      # configure declared, so a suite built without it does not skip those
      # cases - it reports them NOT_BUILT and fails the job.
      - name: Build
        run: cmake --build build/windows --config RelWithDebInfo --target dew dew_tests dew_lang_tests

      - name: Test
        run: ctest --test-dir build/windows -C RelWithDebInfo --output-on-failure --parallel 4

  linux:
    name: linux · gcc · build · test
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

    steps:
      # webkit2gtk and libcurl are deliberately absent: JUCE_WEB_BROWSER=0 and
      # JUCE_USE_CURL=0 mean JUCE finds them missing at configure time and
      # carries on. xvfb because juce_gui_basics opens a display in the suite,
      # and openbox because a bare one is not enough - see the Test step.
      - name: Toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build git pkg-config ca-certificates curl xvfb openbox x11-utils \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libxrender-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev

      # Jammy ships CMake 3.22; CMakePresets v6 needs 3.25.
      - name: CMake
        run: |
          version=4.4.3
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz" \
            | tar xz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-linux-jammy-${{ hashFiles('cpm-package-lock.cmake', 'cmake/DependencyPins.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build/linux-app -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DDEW_BUILD_TESTS=ON
          -DDEW_WRITE_THIRD_PARTY=OFF

      - name: Build
        run: cmake --build build/linux-app --target dew dew_tests dew_lang_tests

      # NOT as root, and that is not hygiene. A container runs as root by
      # default, root can write anywhere, and the suite has a test that a
      # recorder refuses a file it cannot write - so it fails here and passes
      # on every laptop, which is the worst shape a failing test comes in.
      - name: Test
        run: |
          useradd -m suite
          chown -R suite .
          # PATH explicitly: su starts a login-ish shell and resets it, which
          # drops the /opt CMake installed above and makes ctest "not found".
          #
          # And a window manager, which is not decoration. An X server RESETS
          # when its last client disconnects, throwing away every atom it has
          # interned. Under a bare xvfb-run nothing stays connected between
          # test processes, so each one starts on a wiped server where
          # WM_PROTOCOLS does not exist. JUCE asks for that atom with
          # only_if_exists and writes back the None it gets, which fails the
          # first native window with BadAtom - so any test that opens a real
          # popup dies. openbox both holds the connection open and interns the
          # atom, which is why the wait below is for the atom and not a timer.
          cat > /tmp/run-suite.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          openbox >/dev/null 2>&1 &
          for _ in $(seq 1 200); do
            if xlsatoms -name WM_PROTOCOLS >/dev/null 2>&1; then ready=1; break; fi
          done
          [[ -n "${ready:-}" ]] || { echo "the window manager never interned WM_PROTOCOLS"; exit 1; }
          exec ctest --test-dir build/linux-app --output-on-failure --parallel 4
          SH
          chmod 755 /tmp/run-suite.sh
          su suite -c "PATH='$PATH' xvfb-run -a /tmp/run-suite.sh"

  # ----------------------------------------------------------------------------
  # Sanitizers. Separate jobs because ASan and TSan cannot share a build, and
  # separate from the gate above because both are slow enough that putting them
  # in front of every push would be paid for by nobody running the gate.
  # ----------------------------------------------------------------------------
  sanitizers:
    name: macOS · ${{ matrix.preset }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]

    env:
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tsan.supp
      CCACHE_MAXSIZE: 10G
      CCACHE_DEPEND: "true"
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines

    steps:
      - uses: actions/checkout@v4

      - name: Restore dependency sources
        uses: actions/cache@v4
        with:
          # ~/.cache/CPM, because that is what CMakePresets.json's `base` puts
          # in the CMake cache - and a cacheVariable wins over the environment,
          # so a CPM_SOURCE_CACHE set here is read by nothing and this step
          # would faithfully cache an empty directory. The jobs that configure
          # WITHOUT a preset keep the variable, where it is what CPM reads.
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cpm-package-lock.cmake', 'cmake/DependencyPins.cmake') }}

      # These are the most expensive builds in the pipeline - a sanitizer tree
      # compiles the same sources at three to four times the cost of the ci one
      # - and until now they were the only preset jobs building entirely cold.
      # A cache per preset: asan and tsan share no object, since the sanitizer
      # flags are in CMAKE_CXX_FLAGS and hash into every compile.
      - name: Restore compile cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.preset }}-

      - name: Install toolchain
        run: brew bundle

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2

      - name: Save compile cache
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
